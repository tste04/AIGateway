name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Woechentlicher Lauf auch ohne Push: Runner-Images, Container-Basis und
  # Actions driften weiter, waehrend das Repo stillsteht — ein Bruch soll
  # dann auffallen, nicht erst beim naechsten inhaltlichen Commit.
  schedule:
    - cron: "17 6 * * 1"

# Der Workflow liest nur den Checkout — mehr Rechte braucht das Token nicht.
permissions:
  contents: read

# Ein neuer Push auf denselben Ref macht den laufenden Lauf gegenstandslos;
# main-Laeufe laufen aus, damit jede Commit-SHA ihr Ergebnis behaelt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Zwei Plattformen, weil der Code beide bedient: der HTTP-Server waehlt ueber
# `#if canImport(Darwin)` zwischen write(2) und send(2) samt SO_NOSIGPIPE, und
# `UpstreamClient` zwischen Foundation und FoundationNetworking. Ein Lauf allein
# laesst genau diese Zweige ungeprueft.
jobs:
  linux:
    name: Linux (Swift 5.10)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      # Der Container laeuft als root, der Checkout gehoert einem anderen
      # Nutzer — ohne das bricht git mit "dubious ownership" ab.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
